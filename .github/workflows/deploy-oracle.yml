name: Deploy Oracle Server

on:
  push:
    branches:
      - master
    paths:
    - "oracle-server"
    - "oracle-server/**"
    - "frontend"
    - "frontend/**"
    - "deployment/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_TOKEN }}
      
      - name: Configure Git for private submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout required submodules
        run: |
          git submodule update --init oracle-server frontend go-protocol
          git -C go-protocol fetch origin main
          git -C go-protocol checkout --detach origin/main
          git -C go-protocol rev-parse HEAD

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: false

      - name: Configure build workspace
        run: |
          cat > go.work <<'EOF'
          go 1.26.0

          use (
              ./oracle-server
              ./go-protocol
          )
          EOF

      - name: Build Oracle server
        working-directory: oracle-server
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o bmc-oracle ./cmd/bmc-oracle
        
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Inspect build artifacts
        run: |
          echo "---- Backend ----"
          ls -lah oracle-server/
          
          echo "---- Frontend ----"
          find frontend -maxdepth 3 -type f | sort | head -100
          
          echo "---- Deployment ----"
          find deployment -maxdepth 2 -type f | sort
          
      - name: Copy deployment files to Oracle VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: |
            oracle-server/bmc-oracle,frontend/dist/*,deployment/*
          target: /home/ubuntu/deploy

      - name: Deploy on Oracle VM
        uses: appleboy/ssh-action@v1
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_ALLOWED_SUBS: ${{ secrets.GOOGLE_ALLOWED_SUBS }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: GOOGLE_CLIENT_ID, GOOGLE_ALLOWED_SUBS
          script: |
            chmod +x /home/ubuntu/deploy/deployment/scripts/deploy.sh
            /home/ubuntu/deploy/deployment/scripts/deploy.sh